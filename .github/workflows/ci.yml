name: CI/CD Pipeline Java & ArgoCD

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Configuration de Java (JDK 11) et du cache Maven
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 3. Compilation et Tests avec Maven
      - name: Build and Test with Maven
        run: mvn clean package

      # 4. Construction de l'image Docker locale
      - name: Build Docker image locally
        run: docker build -t tlcpro13/webapp-java:latest .

      # 5. Scan de sécurité Trivy (Non bloquant)
      - name: Run Trivy vulnerability scanner
        uses: aquasec/trivy-action@0.28.0
        with:
          image-ref: 'tlcpro13/webapp-java:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      # 6. Connexion sécurisée à Docker Hub (nécessite les Secrets GitHub)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Tag et Push de l'image sur Docker Hub
      - name: Build and Push Docker image
        run: |
          docker tag tlcpro13/webapp-java:latest tlcpro13/webapp-java:${{ github.run_number }}
          docker push tlcpro13/webapp-java:latest
          docker push tlcpro13/webapp-java:${{ github.run_number }}